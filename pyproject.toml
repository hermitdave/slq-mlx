[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slq-mlx"
version = "0.1.0"
description = "SLQ (Statistically-Lossless Quantization) ported to MLX for Apple Silicon"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Hermes Agent", email = "hermes@nousresearch.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "mlx>=0.24.0",
    "mlx-lm>=0.20.0",
    "numpy>=1.24",
    "tqdm>=4.66",
    "safetensors>=0.4",
    "huggingface-hub>=0.20",
    "datasets>=2.16",
    "transformers>=4.36",
    "pulp>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.5",
]
eval = [
    "lm-eval>=0.4.3",
]

[project.scripts]
slq-gptq = "slq_mlx.scripts.run_gptq:main"
slq-build-db = "slq_mlx.scripts.run_build_db:main"
slq-search-dl = "slq_mlx.scripts.run_search_dl:main"
slq-search-tl = "slq_mlx.scripts.run_search_tl:main"
slq-build-ckpt = "slq_mlx.scripts.run_build_ckpt:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["slq_mlx*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true